appId: com.rhmunna143.nativewindowsserverhub
productName: Native Windows Server Hub
copyright: Copyright © 2026 rhmunna143

directories:
  output: dist/release

files:
  - "dist/electron/**/*"
  - "out/**/*"
  - "prisma/**/*"
  - "package.json"
  - "node_modules/@prisma/**/*"
  - "node_modules/.prisma/**/*"
  - "node_modules/@prisma/client/**/*"

extraResources:
  - from: "extraResources/bin"
    to: "extraResources/bin"
    filter:
      - "**/*"
  - from: "extraResources/pgsql"
    to: "extraResources/pgsql"
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  sign: scripts/custom-sign.js

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Native Windows Server Hub"
  artifactName: "${productName}-Setup-${version}.${ext}"
  deleteAppDataOnUninstall: false

portable:
  artifactName: "${productName}-Portable-${version}.${ext}"
